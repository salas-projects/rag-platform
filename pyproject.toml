[project]
name = "rag-platform"
version = "0.1.0"
description = "Documentation assistant for the modern data stack (dbt, Snowflake, Matillion), delivered as a Slack bot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "qdrant-client>=1.9",
    "voyageai>=0.2",
    "anthropic>=0.34",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Phase 2 — internal Streamlit dev/testing UI.
streamlit = ["streamlit>=1.37"]
# Phase 3 — Slack app, Bolt SDK + Socket Mode.
slack = ["slack-bolt>=1.20"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
