services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-platform-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image doesn't bundle curl/wget; bash's /dev/tcp is the
      # dependency-free way to confirm the port is actually accepting connections.
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

# Airflow services are added in Phase 4 (orchestration) — not needed
# for the initial core pipeline build. See /docs/PROJECT_SCOPE.md.
